<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      /* IBM Plex Mono first, reliable fallbacks after */
      font-family:
        "IBM Plex Mono",
        "Courier New",
        Courier,
        monospace;
    }

    .glitch {
      position: relative;
      color: #fff;
      font-family: inherit;

      font-size: clamp(13px, 1.35vw, 18px);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: lowercase;

      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.9),
        0 0 8px rgba(255, 255, 255, 0.35);

      animation: flicker 4s infinite;
    }

    .glitch::before,
    .glitch::after {
      content: "coming soon...";
      position: absolute;
      inset: 0;

      font-family: inherit;
      color: #fff;

      pointer-events: none;
      opacity: 0;
    }

    .glitch::before {
      animation: glitchTop 3.2s infinite steps(1);
    }

    .glitch::after {
      animation: glitchBottom 2.7s infinite steps(1);
    }

    @keyframes flicker {
      0%, 18%, 20%, 22%, 62%, 64%, 100% {
        opacity: 1;
        filter: brightness(1);
      }

      19%, 21%, 63% {
        opacity: 0.25;
        filter: brightness(2);
      }

      72% {
        opacity: 0.85;
      }

      73% {
        opacity: 0.35;
      }

      74% {
        opacity: 1;
      }
    }

    @keyframes glitchTop {
      0%, 82%, 100% {
        opacity: 0;
        transform: none;
        clip-path: inset(0 0 100% 0);
      }

      83% {
        opacity: 0.8;
        transform: translateX(-2px);
        clip-path: inset(20% 0 65% 0);
      }

      84% {
        opacity: 0;
      }

      91% {
        opacity: 0.6;
        transform: translateX(2px);
        clip-path: inset(55% 0 30% 0);
      }

      92% {
        opacity: 0;
      }
    }

    @keyframes glitchBottom {
      0%, 68%, 100% {
        opacity: 0;
        transform: none;
        clip-path: inset(100% 0 0 0);
      }

      69% {
        opacity: 0.7;
        transform: translateX(2px);
        clip-path: inset(65% 0 15% 0);
      }

      70% {
        opacity: 0;
      }

      76% {
        opacity: 0.5;
        transform: translateX(-2px);
        clip-path: inset(35% 0 50% 0);
      }

      77% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="glitch">coming soon...</div>
</body>
</html>
